# Every 15 minutes, copies approved Google Form stories onto the map.
# Can also be run by hand: Actions tab → "Import form stories" → Run workflow.
name: Import form stories

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-story
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: run
        run: node .github/scripts/import-form.mjs
      - if: steps.run.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stories.json index.html
          git commit -m "Import approved form stories"
          git push
